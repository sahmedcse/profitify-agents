name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs at shellcheck's default severity, NOT --severity=warning. The check that
      # matters most here is SC2153 (misspelled variable, e.g. $INFRA_SENTINAL vs
      # $INFRA_SENTINEL) and it is only "info" level — filtering to warnings would
      # silently drop the exact bug class this job exists to catch. Bash treats a
      # misspelled variable as empty, so nothing else notices.
      #
      # Excluded codes, all genuine false positives here:
      #   SC2329 — "function never invoked": helpers are called indirectly as `step <name> <fn>`
      #   SC2317 — same false positive under the older shellcheck the runner image ships
      #   SC2016 — "expressions don't expand in single quotes": intentional, those are grep patterns
      #
      # Pinned via the official image rather than the runner's preinstalled shellcheck, which is
      # older and renames diagnostics between versions — the first run of this workflow failed
      # for exactly that reason. Pinning keeps a local run and CI byte-identical.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            --exclude=SC2329,SC2317,SC2016 scripts/*.sh .claude/hooks/*.sh

      - name: bash syntax
        run: |
          for f in scripts/*.sh .claude/hooks/*.sh; do
            bash -n "$f"
          done

  json:
    name: JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A stray trailing comma here silently voids the whole permission allowlist.
      - name: validate settings.json
        run: jq -e . .claude/settings.json > /dev/null
